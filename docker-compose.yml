services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/cloud_monitoring
      JWT_SECRET: local-compose-secret-change-before-production-123456
      CLIENT_ORIGIN: http://localhost:5173
      METRIC_INTERVAL_SECONDS: 30
      DEMO_MODE: "true"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  mongo-data:
